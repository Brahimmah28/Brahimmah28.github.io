<!DOCTYPE html>
<html>
<head>
    <title>تحقق من التأكيد</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h1>حالة تأكيد البريد</h1>
    <button onclick="checkStatus()">تحقق الآن</button>
    <p id="status"></p>

    <script>
const firebaseConfig = {
    apiKey: "AIzaSyBBCvm6Stbf5gwhP7WwyT_SzZWCkc5zOQY",
    authDomain: "proj-3a555.firebaseapp.com",
    projectId: "proj-3a555",
    storageBucket: "proj-3a555.firebasestorage.app",
    messagingSenderId: "1029150981941",
    appId: "1:1029150981941:web:9f12869810b6d0673e167c"
};

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function checkStatus() {
            const user = auth.currentUser;
            const statusEl = document.getElementById('status');
            
            if (user) {
                if (user.emailVerified) {
                    statusEl.innerHTML = "✅ بريدك مؤكد بنجاح";
                    statusEl.style.color = "green";
                } else {
                    statusEl.innerHTML = "❌ البريد غير مؤكد - <a href='#' onclick='sendVerification()'>إعادة إرسال رابط التأكيد</a>";
                    statusEl.style.color = "red";
                }
            } else {
                statusEl.innerHTML = "⚠️ يرجى تسجيل الدخول أولاً";
                statusEl.style.color = "orange";
            }
        }

        function sendVerification() {
            const user = auth.currentUser;
            if (user) {
                user.sendEmailVerification()
                    .then(() => alert("تم الإرسال! تحقق من بريدك"))
                    .catch(error => alert("خطأ: " + error.message));
            }
        }

        // تحديث الحالة تلقائياً عند تغيير حالة المستخدم
        auth.onAuthStateChanged(() => checkStatus());
    </script>
</body>
</html>
